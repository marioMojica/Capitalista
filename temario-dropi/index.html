<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Temario Dropi Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de lectura; filtro arriba, cursos agrupados por para qué sirven, cada curso se despliega. */
:root{
  --bg:#f7f6f3; --surface:#ffffff; --fg:#1f1d1a; --muted:#6b665e; --line:#e4e0d8;
  --accent:#d4561a; --accent-soft:#fbe9df; --chip:#efece6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171614; --surface:#211f1c; --fg:#ece8e1; --muted:#a39d93; --line:#34312c;
  --accent:#f0793d; --accent-soft:#3a2418; --chip:#2b2925; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#211f1c; --fg:#ece8e1; --muted:#a39d93; --line:#34312c;
  --accent:#f0793d; --accent-soft:#3a2418; --chip:#2b2925; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.stat{background:var(--chip);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:600}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding-block:8px}
.search input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;gap:8px;align-items:baseline}
.group h2 span{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:400}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:baseline;padding:13px 16px}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.name{font-weight:600;flex:1;min-width:0}
.count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
.arrow{color:var(--muted);transition:transform .15s}
details[open] .arrow{transform:rotate(90deg)}
ol{margin:0;padding:0 16px 14px 16px;list-style:none;display:flex;flex-direction:column;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:2.2em 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
li .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
li.quiz{color:var(--muted);font-size:13.5px}
li mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
@media (prefers-reduced-motion: reduce){.arrow{transition:none}}
.keyo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.keyo h2{font-family:var(--display);font-size:19px;margin:0}
.keyo p{margin:0;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip);gap:2px}
.bar i{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.leg b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.pasos{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.pasos li{display:grid;grid-template-columns:auto 1fr;gap:10px;border-bottom:1px dashed var(--line);padding:8px 0}
.pasos .ev{font-size:13px;color:var(--muted)}
.pasos .de{font-size:12px;color:var(--muted)}
.est{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap;align-self:start;margin-top:2px}
.e-hecho{background:#dff1e4;color:#1f6b36}.e-en_curso{background:#fdf0cf;color:#7a5600}.e-falta{background:#fbe0dc;color:#9b2a1c}.e-por_verificar{background:#e3ebf7;color:#2d4f86}.e-en_espera{background:var(--chip);color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .e-hecho{background:#1d3324;color:#8fd3a3}:root:not([data-theme="light"]) .e-en_curso{background:#3a2f12;color:#f0c96a}:root:not([data-theme="light"]) .e-falta{background:#3d1d18;color:#f2a093}:root:not([data-theme="light"]) .e-por_verificar{background:#1c2a40;color:#9dbbe8}}
:root[data-theme="dark"] .e-hecho{background:#1d3324;color:#8fd3a3}:root[data-theme="dark"] .e-en_curso{background:#3a2f12;color:#f0c96a}:root[data-theme="dark"] .e-falta{background:#3d1d18;color:#f2a093}:root[data-theme="dark"] .e-por_verificar{background:#1c2a40;color:#9dbbe8}
li .ks{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:8px}
.keyo details{border:0;background:none}.keyo summary{padding:0;color:var(--accent);font-weight:600;font-size:14px}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>Temario Dropi Academy</h1>
    <p class="sub">Los 21 cursos de la Academia con sus lecciones, en el orden de la plataforma. Se lee en vivo de la base de Capitalista: si se agrega o cambia algo, o avanza un paso de Keyo, aquí aparece al recargar.</p>
    <div class="stats" id="stats"></div>
  </header>
  <section class="keyo" id="keyo"><h2>Qué se ha aplicado a Keyo</h2><p>Cargando…</p></section>
  <div class="search"><input id="q" type="search" placeholder="Buscar un tema: garantías, guías, Meta, novedades…" aria-label="Buscar lección"><label class="toggle"><input type="checkbox" id="solo"> Solo las lecciones que tocan a Keyo</label></div>
  <main id="list" class="wrap" style="gap:26px"><p class="empty">Cargando temario…</p></main>
</div>

<script>
const API="https://eecnaxqejfkrbjmvxerv.supabase.co/functions/v1/temario-dropi";
const KEY_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlY25heHFlamZrcmJqbXZ4ZXJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjA3NTUsImV4cCI6MjA5MjE5Njc1NX0.E_vvvwwl7s9GqyVQDvUxzbQQfoHo3_qrDpJbnc4-OAM";
const G={marca:["Para marca y proveedor","lo que nos toca como Keyo"],vender:["Para vender","lado dropshipper y pauta"],chatea:["Chatea Pro","WhatsApp y automatización"],finanzas:["Finanzas",""]};
const GRUPO={81:"marca",82:"marca",87:"marca",90:"marca",84:"vender",85:"vender",86:"vender",88:"vender",83:"vender",89:"vender",100:"finanzas",101:"finanzas"};
const ORDEN=[81,82,87,90,84,85,86,88,83,89,91,92,93,94,95,96,97,98,99,100,101];
const EST={hecho:["Hecho","#2e9a52"],en_curso:["En curso","#d9a21b"],falta:["Falta","#d4452f"],por_verificar:["Por verificar","#4a78c2"],en_espera:["Espera primer pedido","#a39d93"]};
const ORD_E=["hecho","en_curso","falta","por_verificar","en_espera"];
let K=[];
const chip=e=>`<span class="est e-${e}">${(EST[e]||[e])[0]}</span>`;
function keyo(){const n=K.length,c={};K.forEach(p=>c[p.estado]=(c[p.estado]||0)+1);
const lec=C.reduce((a,x)=>a+x.lecciones.filter(l=>l.k.length).length,0),tot=C.reduce((a,x)=>a+x.lecciones.length,0),cur=C.filter(x=>x.lecciones.some(l=>l.k.length)).length;
const bar=ORD_E.filter(e=>c[e]).map(e=>`<i style="flex:${c[e]};background:${EST[e][1]}"></i>`).join('');
const leg=ORD_E.filter(e=>c[e]).map(e=>`<span><span class="dot" style="background:${EST[e][1]}"></span>${EST[e][0]} <b>${c[e]}</b></span>`).join('');
const lista=ORD_E.map(e=>K.filter(p=>p.estado===e).map(p=>`<li>${chip(p.estado)}<div><div>${esc(p.nombre)}</div>${p.evidencia?`<div class="ev">${esc(p.evidencia)}</div>`:''}<div class="de">Sale de: ${esc([...new Set(p.lecciones)].join(' · '))}</div></div></li>`).join('')).join('');
document.getElementById('keyo').innerHTML=`<h2>Qué se ha aplicado a Keyo</h2><p>De ${tot} lecciones, <b style="color:var(--fg)">${lec}</b> (en ${cur} cursos) se volvieron <b style="color:var(--fg)">${n} pasos</b> concretos para Keyo en Dropi. El resto es contexto o aplica a otros frentes.</p><div class="bar">${bar}</div><div class="leg">${leg}</div><details><summary>Ver los ${n} pasos y de qué lección salen</summary><ul class="pasos" style="margin-top:8px">${lista}</ul></details>`;}
let C=[];
const isQuiz=t=>/quiz/i.test(t);
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const limpia=n=>n.replace(/^Chatea Pro:\s*/i,'');
function hl(t,q){if(!q)return esc(t);const i=norm(t).indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
function stats(at){const total=C.reduce((a,c)=>a+c.lecciones.length,0),qz=C.reduce((a,c)=>a+c.lecciones.filter(l=>isQuiz(l.t)).length,0),tx=C.reduce((a,c)=>a+c.lecciones.filter(l=>l.tx&&!isQuiz(l.t)).length,0);
document.getElementById('stats').innerHTML=`<span class="stat"><b>${C.length}</b> cursos</span><span class="stat"><b>${total}</b> lecciones</span><span class="stat"><b>${qz}</b> cuestionarios</span><span class="stat"><b>${tx}</b> con video transcrito</span><span class="stat">Al día: ${new Date(at).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'})}</span>`;}
function render(){const q=norm(document.getElementById('q').value.trim());const list=document.getElementById('list');const solo=document.getElementById('solo').checked;let html='',any=false;
for(const g of Object.keys(G)){const cs=C.filter(c=>(GRUPO[c.id]||'chatea')===g).map(c=>({c,ls:c.lecciones.filter(x=>(!solo||x.k.length)&&(!q||norm(x.t).includes(q)||norm(c.nombre).includes(q)))})).filter(x=>x.ls.length);
if(!cs.length)continue;any=true;html+=`<section class="group"><h2>${G[g][0]} ${G[g][1]?`<span>· ${G[g][1]}</span>`:''}</h2>`;
for(const {c,ls} of cs){const n=c.lecciones.length,nq=c.lecciones.filter(l=>isQuiz(l.t)).length;
html+=`<details ${q||solo?'open':''}><summary><span class="arrow">›</span><span class="name">${hl(limpia(c.nombre),q)}</span>${(()=>{const m=c.lecciones.filter(l=>l.k.length).length;return m?`<span class="tag">${m} ${m>1?'lecciones':'lección'} → Keyo</span>`:''})()}<span class="count">${n} lecciones${nq?` · ${nq} quiz`:''}</span></summary><ol>`;
for(const x of ls)html+=`<li class="${isQuiz(x.t)?'quiz':''}"><span class="n">${x.o}</span><span>${hl(x.t,q)}${x.k.length?`<span class="ks">${x.k.map(z=>`<span class="est e-${z.e}" title="${esc(z.n)}">Keyo: ${esc(z.n.length>48?z.n.slice(0,46)+'…':z.n)} · ${(EST[z.e]||[z.e])[0]}</span>`).join('')}</span>`:''}</span></li>`;html+='</ol></details>';}
html+='</section>';}
list.innerHTML=any?html:'<p class="empty">Ninguna lección tiene ese tema. Prueba con otra palabra.</p>';}
document.getElementById('q').addEventListener('input',render);document.getElementById('solo').addEventListener('change',render);
fetch(API,{headers:{Authorization:'Bearer '+KEY_ANON,apikey:KEY_ANON}}).then(r=>r.json()).then(d=>{C=d.cursos.sort((a,b)=>(ORDEN.indexOf(a.id)+1||99)-(ORDEN.indexOf(b.id)+1||99));K=d.keyo||[];stats(d.actualizado);keyo();render();})
.catch(()=>{document.getElementById('list').innerHTML='<p class="empty">No se pudo cargar el temario. Recarga la página en un momento.</p>';});
</script>
</body></html>
